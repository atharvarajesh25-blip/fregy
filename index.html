<!doctype html>
<html lang="en" data-theme="dark" data-accent="green">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TS — Personal OS v27</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TS">
<link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root{
  color-scheme:dark;
  --bg:#080b0f;--panel:#0d1117;--card1:#0f141b;--card2:#0c1016;--ink:#f3f6fa;--ink2:#dfe5eb;--muted:#8b95a3;--dim:#6f7985;
  --line:#202833;--line2:#27303b;--soft:#151b23;--field:#0c1117;--btn:#10151c;--btnh:#171e27;--tile:#0d131a;--row:#1d2530;
  --prim:#eef2f5;--primink:#0a0d11;--accent:#75e0a7;--accent2:#5bd991;--blue:#70b9ff;--purple:#a98aff;--yellow:#f1d47a;--red:#f4817a;--danger:#ff8585;
  --check:#dce6ed;--ring:#27313b;--hole:#0d1218;--overlay:rgba(0,0,0,.72);--shadow:0 12px 30px rgba(0,0,0,.18);--radius:14px;
  --bggrad:radial-gradient(circle at 60% -10%,#111923 0,#080b0f 42%,#07090c 100%);--topbg:rgba(7,10,14,.78);--navbg:rgba(8,11,15,.96);
}
[data-theme=light]{
  color-scheme:light;
  --bg:#f3f4f1;--panel:#fff;--card1:#fff;--card2:#fbfbf9;--ink:#12171c;--ink2:#2a3138;--muted:#5f6b78;--dim:#79838f;
  --line:#dde1e4;--line2:#cfd4d9;--soft:#eef0ee;--field:#fff;--btn:#fff;--btnh:#f1f3f1;--tile:#f7f8f6;--row:#e6e9ea;
  --prim:#12171c;--primink:#fff;--accent:#1d9a62;--accent2:#168552;--blue:#2b7fd6;--purple:#7a5bd6;--yellow:#b9860b;--red:#d1493f;--danger:#c23a3a;
  --check:#12171c;--ring:#dfe3e6;--hole:#fff;--overlay:rgba(20,24,28,.45);--shadow:0 8px 24px rgba(20,30,40,.07);
  --bggrad:linear-gradient(#f3f4f1,#f3f4f1);--topbg:rgba(243,244,241,.85);--navbg:rgba(255,255,255,.96);
}
[data-accent=blue]{--accent:#70b9ff;--accent2:#4fa3f5}
[data-accent=purple]{--accent:#a98aff;--accent2:#9270f5}
[data-accent=amber]{--accent:#f1c45c;--accent2:#e6b23a}
[data-accent=rose]{--accent:#f58aa8;--accent2:#ec6c92}
[data-theme=light][data-accent=blue]{--accent:#2b7fd6;--accent2:#1f6cc0}
[data-theme=light][data-accent=purple]{--accent:#7a5bd6;--accent2:#6644c4}
[data-theme=light][data-accent=amber]{--accent:#b9860b;--accent2:#9d7008}
[data-theme=light][data-accent=rose]{--accent:#d24a76;--accent2:#bd3a65}

*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bggrad);background-attachment:fixed;color:var(--ink);font:14px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--blue)}

/* shell */
.app{display:flex;min-height:100vh}
aside{width:200px;background:var(--bg);border-right:1px solid var(--line);padding:24px 10px;position:fixed;inset:0 auto 0 0;z-index:20;overflow-y:auto}
.logo{font-weight:800;font-size:28px;line-height:1;letter-spacing:-.04em;padding:0 14px 26px}
.logo span{display:block;color:#6f94bc;font-size:11px;letter-spacing:.09em;text-transform:uppercase;margin-top:7px;font-weight:600}
.nav{display:grid;gap:3px}
.nav .section{font-size:10px;color:var(--dim);letter-spacing:.14em;margin:12px 7px 4px;border:0;background:transparent;text-align:left;width:calc(100% - 14px);padding:7px 6px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}.nav .section:hover{background:var(--soft);color:var(--ink)}.nav .section .chev{font-size:12px;opacity:.65}.nav .nav-pages{display:grid;gap:3px}
.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:10px 13px;border-radius:10px;font-size:13px}
.nav button:hover,.nav button.active{background:var(--soft);color:var(--ink)}
.nav button.active{box-shadow:inset 2px 0 var(--ink)}
main{margin-left:200px;width:calc(100% - 200px);min-height:100vh}
.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--topbg);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
.top-title{display:flex;align-items:center;gap:8px;min-width:0}
.top h1{font-size:15px;margin:0;letter-spacing:-.02em}
.top .sub{font-size:12px;color:var(--dim);margin-top:3px}
.top-actions{display:flex;gap:8px;align-items:center}
.mobile-back{display:none}
.mobile-back[hidden]{display:none}
.content{padding:28px;max-width:1480px;margin:auto}
.page{display:none}.page.active{display:block}

/* controls */
.iconbtn,.btn{border:1px solid var(--line2);background:var(--btn);color:var(--ink2);border-radius:10px;padding:8px 11px;line-height:1.2}
.iconbtn{width:36px;height:36px;padding:0;display:inline-grid;place-items:center}
.iconbtn:hover,.btn:hover:not(:disabled){background:var(--btnh)}
.btn.primary{background:var(--prim);color:var(--primink);border-color:var(--prim)}
.btn.primary:hover:not(:disabled){filter:brightness(.92);background:var(--prim)}
.btn.danger{color:var(--danger)}
.btn.small{padding:6px 8px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--soft)}
label.btn{display:inline-block;cursor:pointer;text-align:center}
.form{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{background:var(--field);border:1px solid var(--line2);border-radius:10px;padding:9px 10px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--dim)}
input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--accent)}
input[type=range]{padding:0;accent-color:var(--accent)}
textarea{width:100%;min-height:90px;resize:vertical}
.full{width:100%}.grow{flex:1;min-width:120px}
.lbl{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px}

/* surfaces */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}.span-3{grid-column:span 3}
.card{background:linear-gradient(145deg,var(--card1),var(--card2));border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--radius);padding:17px;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.head h2,h2.h{font-size:14px;margin:0}
.muted,.small{color:var(--muted)}.small{font-size:12px}.mini{font-size:11px;color:var(--dim)}
.big{font-size:29px;font-weight:750;letter-spacing:-.05em}
.row{display:flex;align-items:center;gap:9px}.row.wrap{flex-wrap:wrap}.between{justify-content:space-between}
.stack{display:grid;gap:9px}.list{display:grid;gap:7px}
.item{border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--tile);color:var(--ink)}
.item:hover{background:var(--soft)}
.title{font-weight:650;overflow-wrap:anywhere}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:13px}
.kpi .label{font-size:10px;color:var(--dim);letter-spacing:.08em}
.kpi .value{font-size:22px;font-weight:750;margin-top:4px}
.tag,.chip{font-size:10px;border:1px solid var(--line2);background:var(--soft);border-radius:99px;padding:4px 7px;color:var(--muted);white-space:nowrap;display:inline-block}
.chip{font-size:11px;border-radius:8px;padding:5px 7px;white-space:normal}
.tag.good{color:var(--accent);border-color:var(--accent)}.tag.warn{color:var(--yellow);border-color:var(--yellow)}.tag.bad{color:var(--red);border-color:var(--red)}
.tag.btn-like{cursor:pointer}
.linkchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.bar{height:7px;background:var(--ring);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.bar.warn i{background:var(--yellow)}.bar.bad i{background:var(--red)}
.progress{display:grid;gap:6px}.progress-line{display:flex;justify-content:space-between;font-size:12px}
.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:14px;padding-bottom:2px}
.tabs button{border:1px solid var(--line2);background:var(--tile);color:var(--muted);border-radius:99px;padding:7px 11px;white-space:nowrap}
.tabs button.active{background:var(--prim);color:var(--primink);border-color:var(--prim)}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.datebar .date{font-weight:700;min-width:150px;text-align:center}
.priority{font-size:10px;font-weight:800}
.p1{color:var(--red)}.p2{color:var(--yellow)}.p3{color:var(--accent)}
.check{width:22px;height:22px;border:1px solid var(--dim);border-radius:7px;background:var(--field);display:grid;place-items:center;flex:0 0 auto;padding:0;font-size:13px}
.check.done{background:var(--check);color:var(--bg);border-color:var(--check)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:middle}
th{color:var(--muted);font-weight:600}
.scroll-x{overflow-x:auto}
.money-positive{color:var(--accent)}.money-negative{color:var(--danger)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 auto;display:inline-block}
.sep{height:1px;background:var(--line);margin:14px 0}

/* modal, palette, toast */
.modal,.overlay{position:fixed;inset:0;background:var(--overlay);display:none;z-index:50;padding:20px}
.modal{place-items:center}.modal.open{display:grid}
#confirm{z-index:70}
.modalbox{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:18px;padding:20px}
.modalbox.wide{width:min(900px,100%)}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.modalhead h3{margin:0}
.x{border:0;background:transparent;font-size:24px;color:var(--muted);line-height:1}
.overlay{z-index:60;padding:80px 16px}.overlay.open{display:block}
.palette{max-width:680px;margin:auto;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:14px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.palette input{width:100%;font-size:16px;padding:12px}
.results{margin-top:10px;display:grid;gap:2px;max-height:56vh;overflow:auto}
.result{padding:9px 10px;border-radius:9px;display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;width:100%;text-align:left;background:transparent;border:0}
.result:hover,.result.sel{background:var(--soft)}
.result .kind{font-size:10px;color:var(--dim);white-space:nowrap}
.rgroup{font-size:10px;letter-spacing:.1em;color:var(--dim);margin:8px 10px 2px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--prim);color:var(--primink);padding:11px 14px;border-radius:10px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:90;display:flex;gap:12px;align-items:center;max-width:min(92vw,420px)}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:3px 9px;font-weight:700}


/* v14 command center */
.ts-commandbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:0 0 14px}
.ts-commandbar button{border:1px solid var(--line);background:var(--tile);color:var(--ink);border-radius:12px;padding:11px 12px;text-align:left;min-height:58px}
.ts-commandbar button:hover{background:var(--soft);border-color:var(--line2)}
.ts-commandbar b{display:block;font-size:12px}.ts-commandbar span{display:block;font-size:10px;color:var(--dim);margin-top:4px}
.next-move{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;padding:15px 17px;border-color:var(--accent)}
.next-title{font-size:19px;font-weight:780;letter-spacing:-.025em;margin:3px 0 4px;overflow-wrap:anywhere}
.system-pulse{margin-top:16px}
.pulse-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}
.pulse-item{border:1px solid var(--line);background:var(--tile);color:var(--ink);border-radius:11px;padding:12px;text-align:left}
.pulse-item:hover{background:var(--soft)}.pulse-value{display:block;font-size:20px;font-weight:800}.pulse-label{display:block;color:var(--dim);font-size:10px;margin-top:4px}
@media(max-width:900px){.ts-commandbar{grid-template-columns:repeat(2,minmax(0,1fr))}.pulse-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.next-move{align-items:flex-start;flex-direction:column}}
@media(max-width:700px){.ts-commandbar{grid-template-columns:1fr 1fr}.pulse-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.next-title{font-size:17px}}

/* v15 connection intelligence */
/* Impact system — futuristic, connected and mobile-first */
.impact-card{margin-top:14px;overflow:hidden}
.impact-card>.head{margin-bottom:12px}
.impact-card>.head h2{letter-spacing:-.03em}
.impact-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr 1fr;gap:8px;align-items:stretch}
.impact-node{border:1px solid var(--line);background:linear-gradient(180deg,var(--tile),var(--panel));border-radius:11px;padding:11px;min-width:0;transition:border-color .18s,transform .18s,box-shadow .18s}
.impact-node[data-act="openEntity"]{cursor:pointer}
.impact-node[data-act="openEntity"]:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 0 18px rgba(105,245,181,.07)}
.impact-node .impact-kind{font-size:9px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.impact-node b{display:block;margin-top:4px;font-size:12px;overflow-wrap:anywhere}
.impact-arrow{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:16px}
.impact-insight{margin-top:10px;padding:10px 12px;border:1px solid var(--line2);background:var(--soft);border-radius:10px;font-size:12px;line-height:1.45}
.impact-metrics{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.impact-metric{font-size:10px;border:1px solid var(--line2);border-radius:99px;padding:4px 7px;color:var(--muted)}
.goal-impact-list{display:grid;gap:12px}
.goal-impact-row{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 55%),var(--tile);border-radius:15px;padding:14px;overflow:hidden}
.goal-impact-row:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;background:linear-gradient(180deg,var(--accent),transparent);opacity:.65;border-radius:99px}
.goal-impact-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding-left:4px}
.goal-impact-title{font-weight:750;font-size:15px;letter-spacing:-.02em}
.goal-impact-progress{height:4px;border-radius:99px;background:var(--line2);overflow:hidden;margin:10px 0 4px 4px}
.goal-impact-progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),#9dffcf);box-shadow:0 0 10px rgba(105,245,181,.2);min-width:0}
.goal-impact-flow{display:flex;gap:7px;align-items:center;overflow-x:auto;padding:10px 0 3px 4px;scrollbar-width:none}
.goal-impact-flow::-webkit-scrollbar{display:none}
.goal-impact-flow .impact-node{min-width:145px}
.goal-impact-row .tag{font-variant-numeric:tabular-nums}
@media(max-width:900px){
  .impact-grid{grid-template-columns:1fr}
  .goal-impact-flow{
    display:grid;
    grid-template-columns:1fr;
    gap:0;
    overflow:visible;
    padding:8px 0 2px 4px;
    position:relative;
  }
  .goal-impact-flow:before{
    content:"";
    position:absolute;
    left:16px;
    top:19px;
    bottom:19px;
    width:1px;
    background:linear-gradient(180deg,var(--accent),var(--line2));
    opacity:.7;
  }
  .goal-impact-flow .impact-node{
    min-width:0;
    width:100%;
    min-height:49px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px 11px 9px 40px;
    border-radius:10px;
    position:relative;
    background:rgba(10,15,20,.55);
  }
  .goal-impact-flow .impact-node:before{
    content:"";
    position:absolute;
    left:9px;
    width:14px;
    height:14px;
    border-radius:50%;
    border:2px solid var(--dim);
    background:var(--panel);
    z-index:2;
  }
  .goal-impact-flow .impact-node:first-child:before{
    border-color:var(--accent);
    background:var(--accent);
    box-shadow:0 0 12px rgba(105,245,181,.25);
  }
  .goal-impact-flow .impact-node .impact-kind{
    min-width:48px;
    margin:0;
  }
  .goal-impact-flow .impact-node b{margin:0;font-size:12px}
  .goal-impact-flow .impact-arrow{
    height:17px;
    transform:rotate(90deg);
    font-size:13px;
    position:relative;
    z-index:3;
    background:transparent;
  }
  .impact-insight{font-size:11px;margin-top:8px}
  .impact-metrics{margin-top:7px}
}
@media(max-width:700px){
  .impact-card{margin-top:12px}
  .goal-impact-row{padding:13px 11px 12px;border-radius:14px}
  .goal-impact-head{padding-left:3px}
  .goal-impact-progress{margin-left:3px}
  .goal-impact-flow{padding-left:3px}
}

/* today */
.ts-hero{display:flex;align-items:flex-end;justify-content:space-between;margin:0 0 18px;gap:20px}
.ts-hero h2{font-size:36px;line-height:1;margin:0;letter-spacing:-.055em}
.ts-hero .subline{margin-top:8px;color:var(--muted);font-size:13px}
.ts-date{display:flex;gap:9px;align-items:center;margin-bottom:5px}
.ts-date .iconbtn{width:30px;height:30px}
.ts-date strong{min-width:145px;text-align:center;font-size:13px}
.quote{width:min(310px,35%);padding:14px 16px;border:1px solid var(--line);background:var(--panel);border-radius:12px;color:var(--muted);font-size:12px;line-height:1.45;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.banners{display:grid;gap:8px;margin-bottom:14px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border:1px solid var(--line2);border-radius:12px;background:var(--soft);font-size:13px;flex-wrap:wrap}
.banner.warn{border-color:var(--yellow)}.banner.bad{border-color:var(--red)}
.ts-shortcuts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:0 0 18px}
.ts-shortcuts button{border:1px solid var(--line);background:var(--tile);color:var(--ink);border-radius:12px;padding:10px 12px;text-align:left;min-height:58px}
.ts-shortcuts button:hover{background:var(--soft)}
.ts-shortcuts b{display:block;font-size:12px}.ts-shortcuts span{display:block;font-size:10px;color:var(--dim);margin-top:4px}
.ts-dashboard{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.ts-dashboard>*{min-width:0}
.c4{grid-column:span 4}.c8{grid-column:span 8}.c12{grid-column:span 12}
.ts-section-title{font-size:16px;font-weight:700;margin-bottom:14px}
.ts-donut-wrap{display:flex;align-items:center;gap:24px;min-height:150px}
.donut{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--accent) var(--pct),var(--ring) 0);display:grid;place-items:center;position:relative;flex:0 0 auto}
.donut:after{content:"";position:absolute;width:108px;height:108px;background:var(--hole);border-radius:50%}
.donut span{position:relative;z-index:1;font-size:25px;font-weight:800}
.donut small{position:absolute;z-index:1;margin-top:42px;font-size:10px;color:var(--dim)}
.metric-list{display:grid;gap:9px}
.metric-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.metric-row .left{display:flex;align-items:center;gap:8px;min-width:0}
.tinybar{height:6px;width:100px;background:var(--ring);border-radius:9px;overflow:hidden}
.tinybar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.scroll-y{max-height:210px;overflow-y:auto;padding-right:4px}
.streak-num{font-size:32px;font-weight:800}
.streak-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:14px}
.streak-grid i{height:12px;border-radius:50%;background:var(--ring)}
.streak-grid i.on{background:var(--accent2)}.streak-grid i.hot{background:var(--accent)}
.plan-sec{font-size:11px;letter-spacing:.08em;color:var(--dim);margin:14px 0 4px;display:flex;justify-content:space-between;align-items:center}
.plan-sec:first-child{margin-top:0}
.task-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--row)}
.task-row:last-child{border-bottom:0}
.task-row.done .task-name{text-decoration:line-through;color:var(--dim)}
.task-name{font-weight:650;background:transparent;border:0;padding:0;text-align:left;color:inherit;overflow-wrap:anywhere}
.task-meta{font-size:10px;color:var(--dim);margin-top:3px}
.task-time{font-size:11px;color:var(--muted);white-space:nowrap}
.task-acts{display:flex;gap:2px}
.task-acts .btn{padding:3px 6px;font-size:12px;border-color:transparent;background:transparent;color:var(--muted)}
.task-acts .btn:hover{background:var(--soft)}
.task-acts .btn.on{color:var(--yellow)}
.pbadge{font-size:9px;font-weight:800;padding:4px 6px;border-radius:5px;background:var(--soft);color:var(--muted)}
.pbadge.p1{background:rgba(244,129,122,.16);color:var(--red)}.pbadge.p2{background:rgba(241,212,122,.15);color:var(--yellow)}.pbadge.p3{background:rgba(117,224,167,.14);color:var(--accent)}
.quick-tabs{display:flex;gap:6px;margin-bottom:10px}
.quick-tabs button{flex:1;min-width:0;border:1px solid var(--line2);background:var(--tile);color:var(--muted);border-radius:8px;padding:7px;font-size:11px}
.quick-tabs button.active{background:var(--prim);color:var(--primink)}
.quick-input{width:100%;padding:12px}
.quick-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:8px}
.quick-row .btn{grid-column:1/-1}
.schedule-row{display:grid;grid-template-columns:78px 12px 1fr auto;gap:8px;align-items:center;padding:6px 0;font-size:11px}
.schedule-dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}
.schedule-dot.p1{background:var(--red)}.schedule-dot.p2{background:var(--yellow)}.schedule-dot.p3{background:var(--accent)}
.conflict{color:var(--yellow)}
.ts-bottom{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat-tile{padding:14px;background:var(--tile);border:1px solid var(--line);border-radius:13px;text-align:left;color:var(--ink);width:100%}
.stat-tile:hover{background:var(--soft)}
.stat-icon{font-size:18px}.stat-value{font-size:25px;font-weight:800;margin-top:5px}.stat-label{font-size:10px;color:var(--dim)}
.ts-lower{display:grid;grid-template-columns:3fr 4fr 2fr;gap:14px}
.goal-line{margin:11px 0}
.note-line{padding:8px 0;border-bottom:1px solid var(--row);font-size:12px}
.pie{width:155px;height:155px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;position:relative}
.pie:after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;background:var(--hole)}
.pie span{position:relative;z-index:1;font-size:15px;font-weight:800}
.mood-btns{display:flex;gap:6px}
.mood-btns button{flex:1;padding:7px 0;border:1px solid var(--line2);background:var(--tile);border-radius:9px;font-size:16px;opacity:.6}
.mood-btns button.on{opacity:1;border-color:var(--accent);background:var(--soft)}
.checkin-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;align-items:end}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{min-width:60px;text-align:center}
.locked{filter:blur(6px);pointer-events:none;user-select:none}

/* goals */
.goal-card{padding:20px;border-radius:18px}
.goal-card.sub{margin-left:22px;border-left:3px solid var(--line2)}
.goal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.goal-area{font-size:12px;color:var(--muted);margin-bottom:5px}
.goal-title{font-size:18px;font-weight:750;line-height:1.25}
.goal-type{flex:0 0 auto;padding:7px 10px;border-radius:999px;background:rgba(112,185,255,.14);color:var(--blue);font-size:11px}
.goal-meta{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:12px}
.goal-empty{font-size:12px;color:var(--dim);margin-top:10px}
.goal-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:17px}
.goal-actions .spacer{flex:1}
.goal-card.archived{opacity:.65}
.ms{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.ms.done span{text-decoration:line-through;color:var(--dim)}

/* connections / map */
.connection{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--tile)}
.node-type{font-size:9px;letter-spacing:.1em;color:var(--dim)}
.node-title{font-weight:700;margin:3px 0}
.mapwrap{position:relative;overflow-x:auto}
.mapcols{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:34px;position:relative;z-index:1;min-width:820px}
.mapcol h4{margin:0 0 8px;font-size:10px;letter-spacing:.1em;color:var(--dim)}
.mapnode{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:8px;border:1px solid var(--line2);border-radius:10px;background:var(--tile);font-size:12px;overflow-wrap:anywhere}
.mapnode:hover,.mapnode.hl{border-color:var(--accent);background:var(--soft)}
.mapnode.dim{opacity:.35}
.mapsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.mapsvg path{fill:none;stroke:var(--dim);stroke-opacity:.55;stroke-width:1.4}
.mapsvg path.hl{stroke:var(--accent);stroke-opacity:1;stroke-width:2.2}

/* viz */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);grid-auto-columns:11px;justify-content:start;gap:3px}
.heat i{width:11px;height:11px;border-radius:3px;background:var(--ring)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--ring))}.heat i.l2{background:color-mix(in srgb,var(--accent) 65%,var(--ring))}.heat i.l3{background:var(--accent)}
.heat i.miss{background:color-mix(in srgb,var(--red) 40%,var(--ring))}.heat i.off{opacity:.35}
.bars{display:flex;align-items:flex-end;gap:6px;height:80px}
.bars div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.9}
.barlbl{display:flex;gap:6px;font-size:9px;color:var(--dim)}.barlbl span{flex:1;text-align:center}
.trend-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

/* notes */
.md p{margin:.4em 0}.md h3,.md h4{margin:.7em 0 .3em}.md ul{margin:.3em 0;padding-left:20px}.md code{background:var(--soft);padding:1px 5px;border-radius:5px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.md a.wiki{color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--accent)}
.notecard.pinned{border-color:var(--yellow)}

/* focus pill, fab, mobile nav */
.focuspill{display:none;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;border:1px solid var(--accent);background:var(--soft);font-size:12px;max-width:260px}
.focuspill.on{display:inline-flex}
.focuspill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.focuspill b{font-variant-numeric:tabular-nums}
.fab{display:none;position:fixed;right:16px;bottom:78px;width:54px;height:54px;border-radius:50%;border:0;background:var(--prim);color:var(--primink);font-size:28px;line-height:1;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:35}
.mobile-nav{display:none}
.morehead{font-size:10px;letter-spacing:.1em;color:var(--dim);margin:14px 0 6px}
.moregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.moregrid button{padding:14px 8px;border:1px solid var(--line2);background:var(--tile);border-radius:12px}
.moregrid button.active{border-color:var(--accent)}
.triage{text-align:center}
.triage .tx{font-size:20px;font-weight:700;margin:18px 0;overflow-wrap:anywhere}
.triage .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
kbd{border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;font:11px ui-monospace,Menlo,monospace;background:var(--soft)}

@media(max-width:1100px){
  .c4{grid-column:span 6}.c8,.c12{grid-column:span 12}
  .ts-bottom{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ts-lower{grid-template-columns:1fr 1fr}.ts-lower .wide{grid-column:span 2}
}
@media(max-width:900px){
  .mobile-back:not([hidden]){display:inline-grid}aside{display:none}main{margin:0;width:100%;padding-bottom:76px}
  .top{padding:0 15px}.top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .content{padding:15px}.grid{grid-template-columns:1fr}
  .span-12,.span-8,.span-7,.span-6,.span-5,.span-4,.span-3{grid-column:span 1}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .mobile-nav{position:fixed;z-index:30;bottom:0;left:0;right:0;display:flex;padding:6px 6px max(6px,env(safe-area-inset-bottom));background:var(--navbg);border-top:1px solid var(--line);backdrop-filter:blur(14px)}
  .mobile-nav button{flex:1;border:0;border-radius:8px;background:transparent;color:var(--muted);padding:8px 4px;font-size:11px}
  .mobile-nav button.active{background:var(--soft);color:var(--ink)}
  .mobile-nav b{display:block;font-size:16px;font-weight:400}
  .fab{display:block}.ts-shortcuts{display:none}.checkin-grid{grid-template-columns:1fr;gap:14px}
  .trend-grid{grid-template-columns:1fr}
}
@media(max-width:700px){
  .content{padding:14px 14px 28px}
  .top{height:64px}.top .hide-mobile{display:none}
  .ts-hero{display:block}.ts-hero h2{font-size:30px}.quote{width:100%;margin-top:15px;font-size:11px}
  .ts-dashboard{gap:12px}.c4,.c8,.c12{grid-column:span 12}
  .ts-quick{order:-1}
  .ts-bottom{gap:10px}.ts-lower{display:block}.ts-lower>.card{margin-bottom:14px}
  .ts-donut-wrap{justify-content:center}.donut{width:130px;height:130px}.donut:after{width:92px;height:92px}
  .goal-card{padding:16px}.goal-title{font-size:17px}.goal-actions .spacer{display:none}
  .task-row{grid-template-columns:24px minmax(0,1fr) auto}.task-row .task-time,.task-row .pbadge{display:none}
  .toast{right:12px;left:12px;bottom:84px;max-width:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ===== TS 2.0 visual layer — mobile-first, screenshot-inspired ===== */
:root{
  --ts-black:#050607;
  --ts-surface:#0b0d10;
  --ts-card:#111419;
  --ts-card2:#0d1014;
  --ts-border:#262a31;
  --ts-border2:#333841;
  --ts-text:#f7f8fa;
  --ts-muted:#9299a4;
  --ts-glow:rgba(117,224,167,.18);
  --ts-shadow:0 18px 50px rgba(0,0,0,.35);
}
body{
  background:
    radial-gradient(900px 500px at 50% -160px,rgba(255,255,255,.075),transparent 62%),
    radial-gradient(700px 420px at 100% 35%,rgba(117,224,167,.045),transparent 70%),
    #050607;
}
.app{min-height:100dvh}
aside{
  background:rgba(6,8,10,.88);
  border-right:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(24px);
}
.logo{font-size:26px}
main{background:transparent}
.top{
  height:64px;
  padding:0 22px;
  background:rgba(5,7,9,.74);
  border-bottom:1px solid rgba(255,255,255,.075);
  backdrop-filter:blur(24px) saturate(130%);
}
.top h1{font-size:15px;font-weight:750}
.top .sub{font-size:11px;color:#737b87}
.top-title{gap:9px}
.top-actions{gap:7px}
.mobile-menu{display:none}
.top-add{display:none}
.content{max-width:1180px;padding:24px}
.card{
  background:linear-gradient(145deg,rgba(20,23,28,.96),rgba(11,14,18,.96));
  border:1px solid rgba(255,255,255,.075);
  box-shadow:0 12px 35px rgba(0,0,0,.20);
  border-radius:16px;
}
.card:hover{border-color:rgba(255,255,255,.11)}
.btn,.iconbtn,input,select,textarea{
  border-color:rgba(255,255,255,.12);
}
.btn{
  background:rgba(255,255,255,.035);
  border-radius:10px;
}
.btn.primary{
  background:#f2f4f6;
  color:#090b0d;
  box-shadow:0 5px 18px rgba(255,255,255,.08);
}
.iconbtn{
  background:rgba(255,255,255,.035);
  border-radius:10px;
}
.kpi,.item,.stat-tile,.pulse-item,.impact-node,.connection,.mapnode{
  background:linear-gradient(145deg,#14171c,#0e1115);
  border-color:rgba(255,255,255,.075);
}
.tabs{
  padding:3px;
  background:#111419;
  border:1px solid rgba(255,255,255,.07);
  border-radius:11px;
}
.tabs button{
  border:0;
  background:transparent;
  border-radius:8px;
}
.tabs button.active{
  background:#f1f3f5;
  color:#080a0d;
  box-shadow:0 2px 10px rgba(0,0,0,.22);
}
.bar{background:#292e36}
.bar i{
  background:linear-gradient(90deg,var(--accent),#a1ffd0);
  box-shadow:0 0 10px var(--ts-glow);
}
.ts-hero h2{font-size:34px;font-weight:800}
.ts-commandbar button{
  background:linear-gradient(145deg,#15181d,#0c0f13);
  border-color:rgba(255,255,255,.08);
  transition:.2s ease;
}
.ts-commandbar button:hover{
  transform:translateY(-2px);
  border-color:rgba(117,224,167,.35);
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}
.next-move{
  background:linear-gradient(100deg,rgba(117,224,167,.08),rgba(15,18,22,.96) 55%);
  box-shadow:0 0 35px rgba(117,224,167,.045);
}
.next-title{font-size:20px}
.donut{
  box-shadow:0 0 35px rgba(117,224,167,.07),inset 0 0 25px rgba(255,255,255,.02);
}
.ts-bottom .stat-tile{
  transition:.2s ease;
}
.ts-bottom .stat-tile:hover{transform:translateY(-2px)}
.goal-card{
  background:linear-gradient(145deg,#14171c,#0c0f13);
  border-radius:18px;
}
.goal-card:hover{box-shadow:0 16px 45px rgba(0,0,0,.24)}
.goal-type{background:rgba(112,185,255,.10);border:1px solid rgba(112,185,255,.18)}
.focuspill{
  background:rgba(117,224,167,.08)!important;
  box-shadow:0 0 20px rgba(117,224,167,.06);
}
.modal{
  background:rgba(0,0,0,.74);
  backdrop-filter:blur(12px);
}
.modalbox{
  background:linear-gradient(145deg,#15181d,#0b0e12);
  border-color:rgba(255,255,255,.11);
  box-shadow:0 30px 100px rgba(0,0,0,.55);
}
.palette{
  background:linear-gradient(145deg,#15181d,#0b0e12);
  border-color:rgba(255,255,255,.10);
}
.toast{
  box-shadow:0 15px 45px rgba(0,0,0,.45);
}
.ts-mobile-hero{
  display:none;
}
.ts-feature-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.ts-feature{
  padding:14px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.07);
  background:linear-gradient(145deg,#15181d,#0c0f13);
}
.ts-feature b{display:block;font-size:14px}
.ts-feature span{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.ts-ring-mini{
  width:48px;height:48px;border-radius:50%;
  display:grid;place-items:center;
  background:conic-gradient(var(--accent) var(--p),#292e36 0);
  position:relative;
}
.ts-ring-mini:after{content:"";width:36px;height:36px;border-radius:50%;background:#101318;position:absolute}
.ts-ring-mini span{position:relative;z-index:1;font-size:10px;font-weight:800}
.ts-recent{
  display:grid;gap:0;
}
.ts-recent-row{
  display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;
  padding:11px 0;border-bottom:1px solid rgba(255,255,255,.055);
}
.ts-recent-row:last-child{border-bottom:0}
.ts-avatar{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:#181c22;border:1px solid rgba(255,255,255,.08);font-size:15px;
}
.focus-modal{
  width:min(680px,100%)!important;
  min-height:70vh;
  display:flex;flex-direction:column;justify-content:center;
  text-align:center;
}
.focus-orb{
  width:min(330px,70vw);aspect-ratio:1;border-radius:50%;
  margin:24px auto;
  display:grid;place-items:center;
  background:conic-gradient(#f4f5f7 var(--focus-pct,70%),#30353e 0);
  box-shadow:0 0 70px rgba(255,255,255,.08),inset 0 0 30px rgba(255,255,255,.04);
  position:relative;
}
.focus-orb:after{
  content:"";position:absolute;inset:12px;border-radius:50%;
  background:#0b0e12;border:1px solid rgba(255,255,255,.06);
}
.focus-orb .focus-inner{position:relative;z-index:1}
.focus-time-big{font-size:54px;font-weight:850;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.focus-label-big{font-size:14px;color:var(--muted);margin-top:3px}
.focus-controls{display:flex;justify-content:center;gap:12px}
.focus-control{
  width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.10);
  background:#15181d;color:var(--ink);font-size:20px;
}
.focus-control.primary{background:#f2f4f6;color:#090b0d}
@media(max-width:900px){
  aside{display:none}
  main{margin:0;width:100%;padding-bottom:84px}
  .content{padding:14px}
  .top{height:62px;padding:0 12px}
  .mobile-menu{display:inline-grid}
  .top-add{display:inline-grid}
  .mobile-back{display:none!important}
  .top .sub{display:none}
  .top-actions .iconbtn{width:35px;height:35px}
  .ts-feature-grid{grid-template-columns:repeat(2,1fr)}
  .mobile-nav{
    display:flex!important;
    position:fixed;
    left:9px;right:9px;bottom:max(8px,env(safe-area-inset-bottom));
    padding:6px;
    border:1px solid rgba(255,255,255,.10);
    border-radius:18px;
    background:rgba(12,14,18,.92);
    box-shadow:0 14px 50px rgba(0,0,0,.5);
    backdrop-filter:blur(22px) saturate(140%);
  }
  .mobile-nav button{
    border-radius:13px!important;
    padding:7px 4px!important;
  }
  .mobile-nav button.active{
    background:#f0f2f4!important;
    color:#090b0d!important;
  }
  .mobile-nav b{font-size:17px!important}
  .fab{display:none}
}
@media(max-width:700px){
  .content{padding:12px 12px 26px}
  .ts-hero h2{font-size:30px}
  .ts-feature-grid{grid-template-columns:1fr 1fr}
  .ts-commandbar{display:grid}
  .ts-commandbar button{min-height:54px}
  .ts-dashboard{gap:10px}
  .card{border-radius:15px}
  .kpis{gap:7px}
  .kpi{padding:11px}
  .kpi .value{font-size:20px}
  .focus-modal{min-height:82vh}
  .focus-time-big{font-size:48px}
}


/* ===== TS Minimal Futuristic v21 ===== */
:root{
  --ts-bg:#050607;
  --ts-panel:#0b0d10;
  --ts-panel-2:#0f1216;
  --ts-line:rgba(255,255,255,.075);
  --ts-line-strong:rgba(255,255,255,.12);
  --ts-white:#f4f6f8;
  --ts-muted:#7d858f;
  --ts-accent:#dfe7e5;
}
html{background:var(--ts-bg)}
body{
  background:
    radial-gradient(650px 300px at 50% -100px,rgba(255,255,255,.045),transparent 70%),
    var(--ts-bg);
  letter-spacing:-.005em;
}
*{box-shadow:none!important}
.card,.item,.kpi,.stat-tile,.pulse-item,.ts-feature,.goal-card,.connection,.mapnode{
  background:rgba(12,15,19,.86)!important;
  border:1px solid var(--ts-line)!important;
  border-radius:14px!important;
}
.card:hover,.item:hover,.stat-tile:hover,.pulse-item:hover{
  border-color:var(--ts-line-strong)!important;
  transform:none!important;
}
.top{
  background:rgba(5,6,8,.84)!important;
  border-bottom:1px solid var(--ts-line)!important;
}
aside{
  background:rgba(5,6,8,.92)!important;
  border-right:1px solid var(--ts-line)!important;
}
.logo{
  letter-spacing:-.04em;

function load(){

/* v5: relations that are really fields (area, project) live on the item; fold any legacy links into them */
function migrateLinks(){
  data.links=data.links.filter(l=>{
    const ka=kindOf(l.from),kb=kindOf(l.to),A=findObj(l.from),B=findObj(l.to);
    const put=(o,f,v)=>{if(o&&!o[f]){o[f]=v;return true}return false};
    if(kb==='Area'&&A&&'areaId' in A)return!put(A,'areaId',l.to);
    if(ka==='Area'&&B&&'areaId' in B)return!put(B,'areaId',l.from);
    if(ka==='Task'&&kb==='Project')return!put(A,'projectId',l.to);
    if(ka==='Project'&&kb==='Task')return!put(B,'projectId',l.from);
    return true;
  });
}

  const P=planFor(d);
  const candidate=P.overdue.find(t=>!t.done)||P.top3.find(t=>!t.done)||P.scheduled.find(t=>!t.done)||P.unplanned[0];
  if(candidate)return {kind:'task',title:candidate.name,meta:[candidate.startTime,candidate.duration?hm(candidate.duration):'',areaName(candidate.areaId),projectName(candidate.projectId)].filter(Boolean).join(' · '),id:candidate.id};

/* ---------- per-item undo (replaces whole-database snapshots) ---------- */
function pushUndo(label,payload){data.undo=[...(data.undo||[]),{label:T(label,80),ts:Date.now(),payload}].slice(-30)}
function removeEntity(coll,id){
  const list=collOf(coll),index=list.findIndex(x=>x.id===id);if(index<0)return null;
  const item=list[index],refs=[];
  const clear=(a,f)=>a.forEach(o=>{if(o[f]===id){refs.push({id:o.id,f,v:id});o[f]=f==='parentId'?null:''}});
  if(coll==='areas')[data.goals,data.projects,data.tasks,data.habits].forEach(a=>clear(a,'areaId'));
  if(coll==='projects')clear(data.tasks,'projectId');
  if(coll==='goals'){clear(data.goals,'parentId');clear(data.money.transactions,'goalId')}
  if(coll==='tasks')clear(data.tasks,'dependsOn');
  if(coll==='chapters')clear(data.study.log,'chapterId');
  if(coll==='subjects')clear(data.study.chapters,'subjectId');
  const lk=data.links.filter(l=>l.from===id||l.to===id);data.links=data.links.filter(l=>l.from!==id&&l.to!==id);
  list.splice(index,1);
  return{t:'entity',coll,item,index,refs,links:lk};
}
function applyUndo(p){
  if(p.t==='entity'){
    const list=collOf(p.coll);if(!list.some(x=>x.id===p.item.id))list.splice(Math.min(p.index,list.length),0,p.item);
    arr(p.refs).forEach(r=>{const o=findObj(r.id);if(o)o[r.f]=r.v});
    arr(p.links).forEach(l=>{if(!data.links.some(z=>z.id===l.id))data.links.push(l)});
  }else if(p.t==='note'){data.notes[p.id]=p.item;arr(p.links).forEach(l=>data.links.push(l))}
  else if(p.t==='link')data.links.push(p.link);
  else if(p.t==='inbox')data.inbox.splice(Math.min(p.index,data.inbox.length),0,p.item);
  else if(p.t==='studylog'){data.study.log.push(p.item);data.study.sessions[p.item.date]=(data.study.sessions[p.item.date]||0)+p.item.minutes}
  else if(p.t==='sleep'){data.sleep.entries=data.sleep.entries.filter(e=>e.date!==p.item.date);data.sleep.entries.push(p.item)}
  else if(p.t==='skillout'){const s=skillsAll().find(x=>x.id===p.skillId);if(s)s.outputs.push(p.item)}
  else throw new Error('unknown undo');
}
function undo(){
  const u=(data.undo||[]).pop();if(!u){toast('Nothing to undo');return}

}

/* ============ engines: habits, tasks, goals, money, stats ============ */
const wdOf=d=>day(d).getDay();
const isDone=(x,d=viewDate())=>!!x.history?.[d];
const strictHabit=h=>h.cadence==='daily'||h.cadence==='weekdays';
const liveHabits=()=>data.habits.filter(h=>!h.archived);
function habitTarget(h){return h.cadence==='daily'?7:h.cadence==='weekdays'?Math.max(1,h.days.length):h.cadence==='weekly'?1:h.perWeek}
function cadenceLabel(h){
  if(h.cadence==='daily')return'daily';if(h.cadence==='weekly')return'once a week';
  if(h.cadence==='perweek')return`${h.perWeek}× a week`;return h.days.slice().sort().map(n=>WEEKDAYS[n]).join(' ');
}
function weekChecks(h,d,before=false){
  const s=weekStart(day(d));let n=0;
  for(let i=0;i<7;i++){const z=iso(add(s,i));if(before&&z>=d)break;if(h.history[z])n++}
  return n;
}
function habitLive(h,d){
  if(h.created&&d<h.created)return false;
  if(h.archived&&(!h.archivedOn||d>=h.archivedOn))return false;
  return true;
}
function dueOn(h,d){
  if(!habitLive(h,d))return false;
  if(h.cadence==='daily')return true;
  if(h.cadence==='weekdays')return h.days.includes(wdOf(d));
  return isDone(h,d)||weekChecks(h,d,true)<habitTarget(h); /* quota habits stay on the list until the week's quota is met */
}
function dayStatus(d){
  const due=data.habits.filter(h=>dueOn(h,d)),strict=due.filter(strictHabit);
  return{due,strict,done:due.filter(h=>isDone(h,d)),strictDone:strict.filter(h=>isDone(h,d))};
}
function streakAt(asOf){
  let n=0;
  for(let i=0;i<400;i++){
    const s=dayStatus(iso(add(asOf,-i)));
    if(!s.strict.length)continue;                       /* nothing required that day: neither counts nor breaks */
    if(s.strictDone.length===s.strict.length)n++;
    else if(i===0)continue;                              /* today still in progress */
    else break;
  }
  return n;
}
function habitStreak(h,asOf){

/* ---------- connection intelligence ---------- */
function linkedIdsForGoal(g){
  const direct=new Set(goalSources(g));
  const projects=new Set(viaProjects(g));
  data.links.forEach(l=>{
    if(l.from===g.id) { if(kindOf(l.to)==='Project') projects.add(l.to); else direct.add(l.to); }
    if(l.to===g.id) { if(kindOf(l.from)==='Project') projects.add(l.from); else direct.add(l.from); }
  });
  projects.forEach(pid=>data.tasks.forEach(t=>{if(t.projectId===pid)direct.add(t.id)}));
  return {direct:[...direct],projects:[...projects]};
}
function goalImpact(g,asOf=viewDate()){
  const ids=linkedIdsForGoal(g), by=(k)=>ids.direct.filter(id=>kindOf(id)===k).map(entity).filter(Boolean);
  const projects=ids.projects.map(entity).filter(Boolean);
  const tasks=by('Task'),habits=by('Habit'),chapters=by('Study'),skills=by('Skill');
  const r=goalRange(g);
  const inRange=d=>!r||!d|| (d>=r.s&&d<=r.e);
  const completedTasks=tasks.filter(t=>t.done&&inRange(t.completedAt||t.scheduledDate)).length;
  const chapterUnits=chapters.reduce((n,c)=>n+c.done,0),chapterTotal=chapters.reduce((n,c)=>n+c.total,0);
  const studyMinutes=chapters.reduce((n,c)=>n+data.study.log.filter(l=>l.chapterId===c.id&&inRange(l.date)).reduce((a,l)=>a+l.minutes,0),0);
  const weekStartIso=iso(weekStart(day(asOf))),weekDays=Array.from({length:7},(_,i)=>iso(add(day(weekStartIso),i))).filter(d=>d<=asOf);
  const habitDue=habits.reduce((n,h)=>n+weekDays.filter(d=>dueOn(h,d)).length,0);
  const habitDone=habits.reduce((n,h)=>n+weekDays.filter(d=>dueOn(h,d)&&isDone(h,d)).length,0);
  const habitConsistency=habitDue?pct(habitDone,habitDue):0;
  const studyTargetDays=weekDays.length;
  const studyTargetMinutes=data.study.target*studyTargetDays;
  const linkedStudyConsistency=studyTargetMinutes?pct(studyMinutes,studyTargetMinutes):0;
  const evidence=[];
  if(chapterTotal)evidence.push(`${chapterUnits}/${chapterTotal} chapter units`);
  if(studyMinutes)evidence.push(`${studyMinutes}m linked study`);
  if(habitDue)evidence.push(`${habitConsistency}% habit consistency`);
  if(tasks.length)evidence.push(`${completedTasks}/${tasks.length} linked tasks done`);
  if(skills.length){const out=skills.reduce((n,s)=>n+s.output,0);if(out)evidence.push(`${out} skill outputs`)}
  const c=goalCalc(g);
  let sentence=`${g.title} is ${c.pct}% complete`;
  if(evidence.length)sentence+=` because ${evidence.slice(0,3).join(', ')}.`;
  else sentence+=`. Connect tasks, habits or study chapters to make the progress explainable.`;
  return {projects,tasks,habits,chapters,skills,chapterUnits,chapterTotal,studyMinutes,habitConsistency,linkedStudyConsistency,completedTasks,evidence,sentence,pct:c.pct};
}

function heatmap(h,weeks=17){
  const ws=weekStart(new Date()),start=add(ws,-7*(weeks-1)),t=today(),cells=[];
  for(let i=0;i<weeks*7;i++){
    const z=iso(add(start,i)),fut=z>t,done=isDone(h,z),due=!fut&&dueOn(h,z)&&strictHabit(h);
    cells.push(`<i class="${fut?'off':done?'l3':due?'miss':''}" title="${z}${done?' · done':''}"></i>`);
  }
  return `<div class="scroll-x"><div class="heat" role="img" aria-label="Last ${weeks} weeks for ${esc(h.name)}">${cells.join('')}</div></div>`;
}

const mapEdges=[];
PAGES.connections=function(){
  const v=ui.connView,ca=ui.connArea;
  const head=`<div class="head"><div><h2>${v==='impact'?'Impact chains':'Connection map'}</h2><div class="small">${v==='impact'?'See exactly how your goals are being driven by projects, tasks, habits and study.':'How areas, goals, projects and actions feed each other. Click a node to open it.'}</div></div><div class="row wrap">${v!=='impact'?`<select id="connAreaSel" data-live="connArea" aria-label="Filter by area"><option value="">All areas</option>${data.areas.map(a=>`<option value="${a.id}" ${a.id===ca?'selected':''}>${esc(a.name)}</option>`).join('')}</select>`:''}<button class="btn primary" data-act="connectPicker">+ Connect</button></div></div><div class="tabs"><button class="${v==='impact'?'active':''}" data-act="connView" data-id="impact">Impact</button><button class="${v==='map'?'active':''}" data-act="connView" data-id="map">Map</button><button class="${v==='list'?'active':''}" data-act="connView" data-id="list">List</button></div>`;
  if(v==='impact'){
    const gs=data.goals.filter(g=>g.status!=='archived');
    $('page-connections').innerHTML=`${head}<div class="card"><div class="small" style="margin-bottom:12px">A connection only matters if it produces evidence. TS follows each goal downward and summarizes the signals it can actually measure.</div><div class="goal-impact-list">${gs.map(goalImpactCard).join('')||emptyMsg('Create a goal first.')}</div></div>`;
  }else if(v==='map'){
    const inArea=o=>!ca||o.id===ca||o.areaId===ca;
    let base=new Set([...data.areas,...data.goals,...data.projects,...data.tasks,...data.habits].filter(inArea).map(o=>o.id));
    if(ca){data.links.forEach(l=>{if(base.has(l.from))base.add(l.to);if(base.has(l.to))base.add(l.from)});data.tasks.forEach(t=>{if(base.has(t.projectId))base.add(t.id)})}
    const cols=[['AREAS',data.areas.filter(a=>base.has(a.id)).map(a=>({id:a.id,label:a.name}))],['GOALS',data.goals.filter(g=>g.status!=='archived'&&base.has(g.id)).map(g=>({id:g.id,label:g.title}))],['PROJECTS',data.projects.filter(p=>p.status!=='archived'&&base.has(p.id)).map(p=>({id:p.id,label:p.name}))],['TASKS & HABITS',[...data.habits.filter(h=>!h.archived&&base.has(h.id)),...data.tasks.filter(t=>!t.done&&base.has(t.id))].map(o=>({id:o.id,label:o.name}))],['STUDY, SKILLS, NOTES',[...data.study.chapters.filter(c=>base.has(c.id)||!ca).map(c=>({id:c.id,label:c.name})),...skillsAll().filter(s=>base.has(s.id)||!ca).map(s=>({id:s.id,label:s.name})),...Object.entries(data.notes).filter(([id])=>base.has(id)||!ca).map(([id,n])=>({id,label:n.title||'Untitled'}))]]];
    const CAP=14,shown=new Set();cols.forEach(c=>{c[2]=c[1].length-CAP;c[1]=c[1].slice(0,CAP);c[1].forEach(n=>shown.add(n.id))});
    mapEdges.length=0;const seen=new Set(),push=(a,b)=>{if(!shown.has(a)||!shown.has(b)||a===b)return;const k=[a,b].sort().join('|');if(seen.has(k))return;seen.add(k);mapEdges.push([a,b])};
    [...data.goals,...data.projects,...data.tasks,...data.habits].forEach(o=>{if(o.areaId)push(o.areaId,o.id)});data.tasks.forEach(t=>{if(t.projectId)push(t.projectId,t.id)});data.links.forEach(l=>push(l.from,l.to));

function noteByTitle(escTitle){const k=String(escTitle).toLowerCase();const e=Object.entries(data.notes).find(([,n])=>esc(n.title).toLowerCase()===k);return e?e[0]:null}
function md(src){
  const inline=s=>s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\[\[([^\]]+)\]\]/g,(m,t)=>{const id=noteByTitle(t);return id?`<a class="wiki" href="#" data-act="openNote" data-id="${id}">${t}</a>`:`<span class="mini">[[${t}]]</span>`});
  let out='',list=false;
  esc(src).split('\n').forEach(line=>{
    const li=line.match(/^\s*[-*]\s+(.*)$/);
    if(li){if(!list){out+='<ul>';list=true}out+=`<li>${inline(li[1])}</li>`;return}
    if(list){out+='</ul>';list=false}
    if(/^##\s+/.test(line))out+=`<h4>${inline(line.replace(/^##\s+/,''))}</h4>`;else if(/^#\s+/.test(line))out+=`<h3>${inline(line.replace(/^#\s+/,''))}</h3>`;else if(line.trim())out+=`<p>${inline(line)}</p>`;
  });
  return out+(list?'</ul>':'');
}

/* ---------- tasks ---------- */
function newTask(f){
  const t={id:uid(),name:T(f.name,200),done:false,status:oneOf(f.status,['open','blocked','deferred'],'open'),priority:[1,2,3].includes(+f.priority)?+f.priority:2,duration:Math.max(0,Math.round(num(f.duration))),scheduledDate:vd(f.scheduledDate),startTime:vt(f.startTime),areaId:data.areas.some(a=>a.id===f.areaId)?f.areaId:'',projectId:data.projects.some(p=>p.id===f.projectId)?f.projectId:'',completedAt:null,dependsOn:'',repeat:oneOf(f.repeat,['none','daily','weekdays','weekly','monthly'],'none'),pinned:false,spent:0,nextId:''};
  data.tasks.push(t);if(t.areaId)data.prefs.lastArea=t.areaId;return t;
}
function setTaskDone(t,done){
  const d=viewDate();t.done=done;t.completedAt=done?d:null;
  if(done&&t.repeat!=='none'&&!t.nextId){
    const from=t.scheduledDate&&t.scheduledDate>d?t.scheduledDate:d,n={...t,id:uid(),done:false,completedAt:null,scheduledDate:nextDate(from,t.repeat),nextId:'',spent:0,pinned:false};
    data.tasks.push(n);t.nextId=n.id;
    data.links.filter(l=>l.from===t.id||l.to===t.id).forEach(l=>data.links.push({id:uid(),from:l.from===t.id?n.id:l.from,to:l.to===t.id?n.id:l.to,relation:l.relation}));
    toast(`Next “${t.name.slice(0,30)}” is on ${fmtS(n.scheduledDate)}`);
  }
  if(!done&&t.nextId){
    const n=data.tasks.find(x=>x.id===t.nextId);
    if(n&&!n.done){data.tasks=data.tasks.filter(x=>x.id!==n.id);data.links=data.links.filter(l=>l.from!==n.id&&l.to!==n.id)}
    t.nextId='';
  }
}
A.toggleTask=el=>{const t=data.tasks.find(x=>x.id===el.dataset.id);if(!t)return;setTaskDone(t,!t.done);save();render()};
A.toggleHabit=el=>{const h=data.habits.find(x=>x.id===el.dataset.id);if(!h)return;const d=viewDate();if(h.history[d])delete h.history[d];else h.history[d]=true;save();render()};
A.pinTask=el=>{const t=data.tasks.find(x=>x.id===el.dataset.id);if(!t)return;if(!t.pinned&&data.tasks.filter(x=>x.pinned&&!x.done).length>=3){toast('Top 3 is full. Unpin one first.');return}t.pinned=!t.pinned;save();render()};
A.rollTask=el=>{const t=data.tasks.find(x=>x.id===el.dataset.id);if(!t)return;t.scheduledDate=today();save();render();toast('Moved to today')};
A.rollAll=()=>{const o=data.tasks.filter(t=>isOverdue(t));o.forEach(t=>t.scheduledDate=today());save();render();toast(`${plural(o.length,'task')} moved to today`)};
A.planTask=el=>{const t=data.tasks.find(x=>x.id===el.dataset.id);if(!t)return;t.scheduledDate=viewDate();save();render()};
A.delTask=el=>{const t=data.tasks.find(x=>x.id===el.dataset.id);if(t)del('tasks',t.id,t.name)};

  if(id){const t=data.tasks.find(x=>x.id===id);if(!t)return;Object.assign(t,{name:T(name,200),priority:+f.priority||2,duration:Math.max(0,Math.round(num(f.duration))),scheduledDate:vd(f.scheduledDate),startTime:vt(f.startTime),areaId:f.areaId,projectId:f.projectId,status:f.status,repeat:f.repeat,dependsOn:val('tDep')===id?'':val('tDep')});if(t.areaId)data.prefs.lastArea=t.areaId}
  else{const t=newTask(f);t.dependsOn=val('tDep')}
  save();done_();

A.saveHabit=el=>{

A.moveHabit=el=>{

/* ---------- connections ---------- */
function relField(a,b){
  const ka=kindOf(a),kb=kindOf(b),X=findObj(a),Y=findObj(b);
  if(kb==='Area'&&X&&'areaId' in X)return[X,'areaId',b];
  if(ka==='Area'&&Y&&'areaId' in Y)return[Y,'areaId',a];
  if(ka==='Task'&&kb==='Project')return[X,'projectId',b];
  if(ka==='Project'&&kb==='Task')return[Y,'projectId',a];
  return null;
}
const relLinked=(a,b)=>{const f=relField(a,b);return f?f[0][f[1]]===f[2]:data.links.some(l=>(l.from===a&&l.to===b)||(l.from===b&&l.to===a))};
function setRel(a,b,on){
  const f=relField(a,b);if(f){if(on)f[0][f[1]]=f[2];else if(f[0][f[1]]===f[2])f[0][f[1]]='';return}
  const ex=data.links.find(l=>(l.from===a&&l.to===b)||(l.from===b&&l.to===a));
  if(on&&!ex)data.links.push({id:uid(),from:a,to:b,relation:'supports'});if(!on&&ex)data.links=data.links.filter(l=>l!==ex);
}

function parseExpense(text){
  const m=text.match(/^\s*(?:[₹$€£]|rs\.?|inr)?\s*(\d[\d,]*(?:\.\d+)?)\s+(.+)$/i)||text.match(/^(.+?)\s+(?:[₹$€£]|rs\.?|inr)\s*(\d[\d,]*(?:\.\d+)?)\s*$/i);
  if(!m)return null;const first=/^\s*(?:[₹$€£]|rs\.?|inr)?\s*\d/i.test(text)&&text.match(/^\s*(?:[₹$€£]|rs\.?|inr)?\s*(\d[\d,]*(?:\.\d+)?)\s+(.+)$/i);
  const amount=num((first?first[1]:m[2]).replace(/,/g,'')),note=(first?first[2]:m[1]).trim();if(!(amount>0))return null;
  const tag=(note.match(/#([\w-]+)/)||[])[1],cat=tag&&data.money.categories.find(c=>c.toLowerCase().startsWith(tag.toLowerCase()));
  return{amount,note:note.replace(/#[\w-]+/g,'').trim(),cat:cat||guessCategory(note)};
}
function budgetAlert(tx){
  if(tx.type!=='expense')return;const bi=budgetInfo(tx.date),m=monthTotals(tx.date),cb=data.money.catBudgets[tx.category],msgs=[];
  if(bi&&bi.over)msgs.push(`Over the monthly budget by ${fm(-bi.left)}`);else if(bi&&bi.pct>=80)msgs.push(`${bi.pct}% of the monthly budget used`);
  if(cb&&m.cats[tx.category]>cb)msgs.push(`${tx.category} is over its ${fm(cb)} budget`);
  if(msgs.length)setTimeout(()=>toast(msgs.join(' · ')),300);
}

/* ---------- CSV import (bank / UPI statements) ---------- */
let csvState=null;
function parseCsv(text){
  text=text.replace(/^\uFEFF/,'');const first=text.split(/\r?\n/,1)[0],delim=[',',';','\t'].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0],rows=[];
  let row=[],c='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===delim){row.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(c);c='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
    else c+=ch;
  }
  row.push(c);if(row.some(x=>x.trim()!==''))rows.push(row);return rows;
}
const MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function parseDate(s,dayFirst){
  s=String(s||'').trim();let y,m,d,x;
  if(x=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)){y=+x[1];m=+x[2];d=+x[3]}
  else if(x=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/)){const a=+x[1],b=+x[2];y=+x[3];if(y<100)y+=2000;if(dayFirst){d=a;m=b}else{m=a;d=b}}
  else if(x=s.match(/^(\d{1,2})[ \-]([A-Za-z]{3})[a-z]*[ \-,]*(\d{2,4})/)){d=+x[1];m=MON.indexOf(x[2].toLowerCase())+1;y=+x[3];if(y<100)y+=2000}
  else return null;
  const dt=new Date(y,m-1,d);return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d?iso(dt):null;
}
const parseAmt=s=>{s=String(s??'').trim();if(!s)return 0;const neg=/^\(|^-|-$/.test(s)||/\bdr\b/i.test(s),n=parseFloat(s.replace(/[^\d.]/g,''));return Number.isFinite(n)?(neg?-n:n):0};
function csvTx(row,m,dayFirst,invert){
  const d=parseDate(row[m.date],dayFirst);if(!d)return null;let type,amt;
  const deb=m.deb>=0?Math.abs(parseAmt(row[m.deb])):0,cr=m.cr>=0?Math.abs(parseAmt(row[m.cr])):0;
  if(deb>0){type='expense';amt=deb}else if(cr>0){type='income';amt=cr}
  else if(m.amt>=0){const n=parseAmt(row[m.amt]);if(!n)return null;type=(n<0)!==invert?'expense':'income';amt=Math.abs(n)}
  else return null;
  const note=T(m.desc>=0?row[m.desc]:'',240);
  return{id:uid(),date:d,type,amount:amt,note,category:type==='expense'?guessCategory(note):(data.money.categories.includes('Income')?'Income':'Others'),goalId:'',recId:''};
}
A.importCsv=()=>{csvState=null;openModal('Import transactions from CSV',`<div class="small">Works with most bank and UPI statement exports. Nothing leaves your device.</div>${F('csvFile','CSV file',`<input id="csvFile" type="file" accept=".csv,text/csv,text/plain" class="full" data-change="csvFile">`)}<div id="csvMap"></div>`,true)};
CH.csvFile=async el=>{
  const f=el.files[0];if(!f)return;if(f.size>10e6){toast('That file is too large');return}
  const rows=parseCsv(await f.text());if(rows.length<2){toast('No rows found in that file');return}
  let hi=rows.slice(0,30).findIndex(r=>r.some(c=>/date/i.test(c))&&r.some(c=>/desc|narr|particular|detail|remark|debit|withdraw|amount/i.test(c)));if(hi<0)hi=0;
  const head=rows[hi].map(h=>h.trim());csvState={head,body:rows.slice(hi+1).slice(0,5000)};
  const g=re=>head.findIndex(h=>re.test(h)),o=(k)=>`<option value="-1">— none —</option>`+head.map((h,i)=>`<option value="${i}" ${i===k?'selected':''}>${esc(h||'Column '+(i+1))}</option>`).join('');
  $('csvMap').innerHTML=`<div class="form"><div class="grow">${sel('cmDate','Date column',o(g(/date/i)))}</div><div class="grow">${sel('cmDesc','Description',o(g(/narration|description|particular|detail|remark|payee|merchant/i)))}</div></div><div class="form"><div class="grow">${sel('cmDeb','Debit / withdrawal',o(g(/debit|withdraw|\bdr\b/i)))}</div><div class="grow">${sel('cmCr','Credit / deposit',o(g(/credit|deposit|\bcr\b/i)))}</div><div class="grow">${sel('cmAmt','Single amount (negative = spent)',o(g(/^amount|^amt/i)))}</div></div><div class="row wrap" style="margin-top:8px"><label class="row"><input type="checkbox" id="cmDayFirst" checked> Dates are day first (31/12/2026)</label><label class="row"><input type="checkbox" id="cmInvert"> Flip spent/received</label></div><div class="row between" style="margin-top:12px"><button class="btn" data-act="csvPreview">Preview</button><button class="btn primary" data-act="csvApply">Import</button></div><div id="csvPrev" style="margin-top:12px"></div>`;
  A.csvPreview();
};
const csvMap=()=>({date:+val('cmDate'),desc:+val('cmDesc'),deb:+val('cmDeb'),cr:+val('cmCr'),amt:+val('cmAmt')});
A.csvPreview=()=>{
  if(!csvState)return;const m=csvMap(),df=$('cmDayFirst').checked,iv=$('cmInvert').checked,ok=csvState.body.map(r=>csvTx(r,m,df,iv)).filter(Boolean);
  $('csvPrev').innerHTML=`<div class="small">${ok.length} of ${csvState.body.length} rows can be read.</div><div class="scroll-x"><table><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th>Amount</th></tr></thead><tbody>${ok.slice(0,5).map(t=>`<tr><td>${t.date}</td><td>${t.type}</td><td>${esc(t.category)}</td><td>${esc(t.note.slice(0,40))}</td><td>${fm(t.amount)}</td></tr>`).join('')}</tbody></table></div>`;
  return ok.length;
};
A.csvApply=()=>{
  if(!csvState)return;const m=csvMap(),df=$('cmDayFirst').checked,iv=$('cmInvert').checked,ok=csvState.body.map(r=>csvTx(r,m,df,iv)).filter(Boolean);
  if(!need(ok.length,'No readable rows. Check the column choices.'))return;
  const key=t=>`${t.date}|${t.type}|${t.amount}|${t.note.toLowerCase()}`,have=new Set(data.money.transactions.map(key));let n=0;
  ok.forEach(t=>{if(!have.has(key(t))){have.add(key(t));data.money.transactions.push(t);n++}});
  save();done_();toast(`Imported ${plural(n,'transaction')}${ok.length-n?` · ${ok.length-n} duplicates skipped`:''}`);
};

/* ---------- money PIN (hides the page; this is a privacy screen, not encryption) ---------- */
async function hashPin(pin){
  const s=KEY+':'+pin;
  try{if(crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return'x'+h;
}

function download(name,text,mime='text/plain'){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:mime+';charset=utf-8'}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}

A.snoozeBackup=()=>{data.meta.snooze=Date.now()+864e5;save();render()};
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(s)},unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt,iter=250000){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
let passCb=null;
function askPass(title,cb,confirm2=false){passCb=cb;openModal(title,`${inp('pwIn','Passphrase','','type="password" autocomplete="off"')}${confirm2?inp('pwIn2','Repeat passphrase','','type="password" autocomplete="off"'):''}<div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn primary" data-act="pwGo" data-x="${confirm2?1:0}">Continue</button></div>`)}

A.backupEnc=()=>{
  if(!crypto.subtle){toast('Encryption needs https or localhost');return}
  askPass('Encrypt this backup',async p=>{
    const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveKey(p,salt);
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify({...data,undo:[]})));
    download(`ts-personal-os-${today()}.encrypted.json`,JSON.stringify({ts_enc:1,kdf:'PBKDF2-SHA256',iter:250000,salt:b64(salt),iv:b64(iv),data:b64(new Uint8Array(ct))}),'application/json');
    data.meta.lastBackup=Date.now();save();render();toast('Encrypted backup downloaded. If you forget the passphrase it cannot be recovered.');
  },true);
};
CH.importFile=async el=>{
  const f=el.files[0];el.value='';if(!f)return;if(f.size>50e6){toast('That file is too large');return}
  let obj;try{obj=JSON.parse(await f.text())}catch(e){toast('That is not a valid backup file');return}
  if(obj&&obj.ts_enc){
    if(!crypto.subtle){toast('Decryption needs https or localhost');return}
    askPass('Passphrase for this backup',async p=>{try{const key=await deriveKey(p,unb64(obj.salt),obj.iter||250000),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(obj.iv)},key,unb64(obj.data));closeModal();applyImport(JSON.parse(new TextDecoder().decode(pt)));return true}catch(e){toast('Wrong passphrase, or the file is damaged');return false}});return;
  }
  applyImport(obj);
};
async function applyImport(obj){
  if(!obj||typeof obj!=='object'||Array.isArray(obj)||!(obj.tasks||obj.habits||obj.areas||obj.goals)){toast('That file does not look like a TS backup');return}
  const from=+obj.version||0,counts=`${arr(obj.tasks).length} tasks, ${arr(obj.habits).length} habits, ${arr(obj.goals).length} goals, ${Object.keys(obj.notes||{}).length} notes`;
  if(!(await ask(`Replace everything in this browser with this backup (${counts})? A copy of your current data is kept so you can restore it.${from>VERSION?' This backup is from a newer version, so some fields may be ignored.':''}`,'Replace my data',true)))return;
  try{localStorage.setItem(PRE_KEY,JSON.stringify({...data,undo:[]}))}catch(e){if(!(await ask('Your current data could not be copied first (storage is full). Continue anyway?','Continue',true)))return}
  data=normalize(obj);if(from<5)migrateLinks();ui.moneyOpen=false;save();runJobs();closeModal();applyTheme();render(true);toast('Backup restored. Your previous data is kept under Settings.');
}

A.resetProgress=async()=>{
  const ok=await ask('Reset all progress? Your tasks, habits, goals, study chapters, projects, notes and money will stay. Completion history, study/activity logs, goal progress, skill practice, sleep/check-ins, heatmaps and stats will start fresh.','Reset progress',true);
  if(!ok)return;
  try{
    /* Keep the system itself; clear only activity/completion data that feeds progress, heatmaps and stats. */
    /* Tasks: keep every task, but remove completion/activity state. */
    data.tasks.forEach(t=>{t.done=false;t.completedAt='';t.spent=0});
    /* Habits: keep definitions/cadence/order, remove every check-in. */
    data.habits.forEach(h=>{h.history={}});
    /* Goals: keep the goal itself and its dates/target/links, but return it to active zero-progress. */
    data.goals.forEach(g=>{
      g.progress=0; g.progressLog=[]; g.status='active';
      g.milestones=arr(g.milestones).map(m=>({...m,done:false}));
    });
    /* Study: keep subjects + chapter definitions, remove completion and study-time history. */
    data.study.sessions={}; data.study.log=[];
    data.study.chapters.forEach(c=>{c.done=0;c.log={};c.finishedOn='';c.rev=arr(c.rev).map(r=>({...r,done:false}))});
    /* Recovery / check-in history is activity data. */
    data.sleep.entries=[]; data.mood={}; data.water={}; data.reviews={};
    /* Skills: keep definitions, clear accumulated practice/output. */
    data.skills.current=data.skills.current?{...data.skills.current,practice:0,output:0,log:[],outputs:[]}:null;
    data.skills.history=data.skills.history.map(x=>({...x,practice:0,output:0,log:[],outputs:[]}));
    data.focus=null; data.undo=[]; data.meta.progressResetAt=today();
    save();
    closeModal();
    state.date=new Date();
    render(true);
    toast('Progress reset · your setup was kept');
  }catch(e){toast('Could not reset progress')}
};

let palItems=[],palSel=0;
const dayWords={sun:0,sunday:0,mon:1,monday:1,tue:2,tues:2,tuesday:2,wed:3,wednesday:3,thu:4,thur:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6};
function parseQuick(text){
  let s=' '+text.trim()+' ';const r={priority:2,date:null,time:'',duration:30,areaId:'',projectId:'',repeat:'none'};
  const take=(re,fn)=>{const m=s.match(re);if(m){fn(m);s=s.replace(re,' ')}};
  take(/\sp([123])\s/i,m=>r.priority=+m[1]);
  s=s.replace(/\s#([\w-]+)(?=\s)/g,(all,w)=>{const a=data.areas.find(x=>x.name.toLowerCase().startsWith(w.toLowerCase()));if(a&&!r.areaId){r.areaId=a.id;return' '}return all});
  s=s.replace(/\s@([\w-]+)(?=\s)/g,(all,w)=>{const p=data.projects.find(x=>x.status!=='archived'&&x.name.toLowerCase().replace(/\s+/g,'-').startsWith(w.toLowerCase()));if(p&&!r.projectId){r.projectId=p.id;return' '}return all});
  take(/\severy (day|weekday|week|month)\s/i,m=>r.repeat={day:'daily',weekday:'weekdays',week:'weekly',month:'monthly'}[m[1].toLowerCase()]);
  take(/\s(daily|weekly|monthly)\s/i,m=>r.repeat=m[1].toLowerCase());
  take(/\s(\d+(?:\.\d+)?)\s?(m|min|mins|h|hr|hrs)\s/i,m=>r.duration=Math.round(+m[1]*(/^h/i.test(m[2])?60:1)));
  take(/\s(?:at\s)?(\d{1,2})(?::(\d{2}))?\s?(am|pm)\s/i,m=>{let h=+m[1]%12+(/pm/i.test(m[3])?12:0);r.time=`${pad(h)}:${m[2]||'00'}`});
  if(!r.time)take(/\s(?:at\s)?([01]?\d|2[0-3]):([0-5]\d)\s/,m=>r.time=`${pad(+m[1])}:${m[2]}`);
  const t0=today();
  take(/\s(\d{4}-\d{2}-\d{2})\s/,m=>{if(vd(m[1]))r.date=m[1]});
  take(/\s(today|tod)\s/i,()=>r.date=t0);take(/\s(tomorrow|tmrw|tmr)\s/i,()=>r.date=addIso(t0,1));
  take(/\sin (\d{1,3}) days?\s/i,m=>r.date=addIso(t0,+m[1]));
  take(/\snext week\s/i,()=>{const n=7-((new Date().getDay()+6)%7);r.date=addIso(t0,n)});
  take(new RegExp(`\\s(${Object.keys(dayWords).join('|')})\\s`,'i'),m=>{const w=dayWords[m[1].toLowerCase()];let n=(w-new Date().getDay()+7)%7;if(n===0)n=7;r.date=addIso(t0,n)});
  r.name=T(s.replace(/\s+/g,' ').trim(),200);return r;
}

function searchAll(q){
  const H=[];
  data.areas.forEach(x=>H.push({id:x.id,kind:'Area',label:x.name,text:x.name+' '+x.desc}));data.goals.forEach(x=>H.push({id:x.id,kind:'Goal',label:x.title,text:x.title+' '+x.why}));
  data.projects.forEach(x=>H.push({id:x.id,kind:'Project',label:x.name,text:x.name}));data.tasks.forEach(x=>H.push({id:x.id,kind:'Task',label:x.name,text:x.name+' '+areaName(x.areaId)+' '+projectName(x.projectId)}));
  data.habits.forEach(x=>H.push({id:x.id,kind:'Habit',label:x.name,text:x.name}));data.study.chapters.forEach(x=>H.push({id:x.id,kind:'Study',label:x.name,text:x.name}));
  skillsAll().forEach(x=>H.push({id:x.id,kind:'Skill',label:x.name,text:x.name+' '+x.outputs.map(o=>o.title).join(' ')}));
  Object.entries(data.notes).forEach(([id,n])=>H.push({id,kind:'Note',label:n.title||'Untitled',text:n.title+' '+n.body+' '+n.tags.join(' ')}));
  data.inbox.forEach(x=>H.push({id:x.id,kind:'Inbox',label:x.text.slice(0,80),text:x.text}));
  const ql=q.toLowerCase();return H.filter(h=>h.text.toLowerCase().includes(ql)).sort((a,b)=>(b.label.toLowerCase().startsWith(ql)-a.label.toLowerCase().startsWith(ql))).slice(0,10);
}
function palBuild(q){
  const items=[],t=q.trim(),ql=t.toLowerCase();
  if(t){
    const p=parseQuick(t),ex=parseExpense(t);
    if(p.name)items.push({g:'CREATE',label:`Add task: ${p.name}`,meta:describeTask(p),run:()=>makeParsedTask(p)});
    if(ex)items.push({g:'CREATE',label:`Log expense: ${fm(ex.amount)} · ${ex.cat}`,meta:ex.note,run:()=>{const tx={id:uid(),date:viewDate(),type:'expense',category:ex.cat,amount:ex.amount,note:ex.note,goalId:'',recId:''};data.money.transactions.push(tx);save();render(true);toast('Expense added');budgetAlert(tx)}});
    items.push({g:'CREATE',label:'Save to inbox',meta:t.slice(0,60),run:()=>{addInbox(t);save();render(true);toast('Saved to inbox')}});
    items.push({g:'CREATE',label:'Save as note',meta:t.slice(0,60),run:()=>{data.notes[uid()]={title:T(t.split('\n')[0],60),body:t.length>60?t:'',date:today(),tags:[],pinned:false,updated:Date.now()};save();render(true);toast('Note saved')}});
  }
  const cm=CMDS().filter(c=>!ql||c.label.toLowerCase().includes(ql));cm.slice(0,t?6:40).forEach(c=>items.push({g:'COMMANDS',label:c.label,meta:c.kind,run:c.run}));
  if(ql.length>=2)searchAll(ql).forEach(h=>items.push({g:'FOUND',label:h.label,meta:h.kind,run:()=>h.kind==='Inbox'?go('inbox'):A.openEntity({dataset:{id:h.id}})}));
  return items;
}

  /* Replace the fragile nested Areas renderer with a safe, self-contained one. */
  /* v29.6 — single, fault-tolerant Areas OS renderer */
  PAGES.areas=function(){
    const root=$('page-areas');
    if(!root)return;
    try{
      const areas=Array.isArray(data.areas)?data.areas:[];
      const icons=['◉','◇','⌂','◌','▣','◎','□','◈'];
      const rows=areas.map((a,i)=>{
        const goals=(data.goals||[]).filter(g=>g.areaId===a.id&&g.status!=='archived');
        const projects=(data.projects||[]).filter(x=>x.areaId===a.id&&x.status!=='archived');
        const tasks=(data.tasks||[]).filter(t=>t.areaId===a.id&&!t.done);
        const habits=(data.habits||[]).filter(h=>h.areaId===a.id&&!h.archived);
        return {a,i,goals,projects,tasks,habits};
      });

      /* Area-only completion trend: no global TS data. */
      const end=viewDate(), points=[];
      for(let i=13;i>=0;i--){
        const d=add(end,-i), z=iso(d); let planned=0,done=0;
        (data.tasks||[]).filter(t=>t.areaId&&t.scheduledDate===z).forEach(t=>{planned++;if(t.done)done++});
        (data.habits||[]).filter(h=>h.areaId&&!h.archived&&dueOn(h,z)).forEach(h=>{planned++;if(isDone(h,z))done++});
        points.push({label:d.toLocaleDateString(undefined,{month:'short',day:'numeric'}),value:planned?Number(pct(done,planned)):0});
      }
      const W=680,H=190,L=34,R=12,T=16,B=30;
      const max=100, px=i=>L+i*(W-L-R)/Math.max(1,points.length-1), py=v=>T+(H-T-B)*(1-v/max);
      const poly=points.map((p,i)=>`${px(i).toFixed(1)},${py(p.value).toFixed(1)}`).join(' ');
      const dots=points.map((p,i)=>`<circle class="dot" cx="${px(i)}" cy="${py(p.value)}" r="3"/>`).join('');
      const labels=points.map((p,i)=>(i===0||i===6||i===13)?`<text class="axis" x="${px(i)}" y="${H-8}" text-anchor="middle">${esc(p.label)}</text>`:'').join('');
      const timeline=(data.tasks||[]).filter(t=>t.areaId&&t.startTime).sort((a,b)=>((a.scheduledDate||'9999')+(a.startTime||'')).localeCompare((b.scheduledDate||'9999')+(b.startTime||''))).slice(0,10);

      root.innerHTML=`<div class="v29-shell">
        <div class="v29-head">
          <div><div class="v29-title">Areas</div><div class="v29-sub">The parts of life you maintain over time.</div></div>
          <button class="btn primary" data-act="addArea">+ Area</button>
        </div>

        <div class="v29-card" style="margin-bottom:10px">
          <div class="v29-label">LIFE MAP</div>
          <div style="font-size:12px;color:var(--muted);margin-top:6px">Choose an area to work inside that part of your life.</div>
        </div>

        <div class="v29-area-map">
          ${rows.map(r=>`<button type="button" class="v29-area v294-area-card" data-act="openAreaView" data-id="${esc(r.a.id)}">
            <div style="text-align:left">
              <div class="v29-area-icon">${icons[r.i%icons.length]}</div>
              <div class="v29-area-name">${esc(r.a.name)}</div>
              <div class="v29-area-meta">${r.goals.length} goals · ${r.projects.length} projects · ${r.tasks.length} tasks</div>
            </div>
            <div class="v29-area-foot"><span class="v29-pill">${r.habits.length} habits</span><span class="btn small">Open</span></div>
          </button>`).join('') || `<div class="v29-card" style="grid-column:1/-1;text-align:center;padding:28px"><div style="font-size:28px">◈</div><b style="display:block;margin-top:8px">No areas yet</b><div class="mini" style="margin-top:5px">Create Health, College, Finance or any other area you want to maintain.</div><button class="btn primary" style="margin-top:14px" data-act="addArea">+ Create first area</button></div>`}
        </div>

        <div class="v29-card" style="margin-top:10px">
          <div class="v29-label">AREA PROGRESS</div>
          <div style="font-size:17px;font-weight:800;margin-top:5px">Completion of area-linked work</div>
          <svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;height:190px;margin-top:8px" role="img" aria-label="Area progress over the last 14 days">
            <line x1="${L}" x2="${W-R}" y1="${py(0)}" y2="${py(0)}" stroke="var(--line)"/>
            <line x1="${L}" x2="${W-R}" y1="${py(50)}" y2="${py(50)}" stroke="var(--line)"/>
            <line x1="${L}" x2="${W-R}" y1="${py(100)}" y2="${py(100)}" stroke="var(--line)"/>
            <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${poly}"/>${dots}${labels}
          </svg>
          <div class="chart-note">Only tasks + habits assigned to Areas · last 14 days</div>
        </div>

        <div class="v29-card v29-work-timeline" style="margin-top:10px">
          <div class="v29-label">AREA TIMELINE</div>
          <div class="mini" style="margin-top:4px">Only scheduled tasks connected to an area.</div>
          ${timeline.length?timeline.map(t=>`<div class="v29-tl-row"><div class="v29-tl-date">${esc(t.scheduledDate?fmtS(t.scheduledDate):'Unscheduled')}<br>${esc(t.startTime)}</div><div class="v29-tl-main"><b>${esc(t.name)}</b><span>${esc(areaName(t.areaId))} · ${hm(t.duration)}</span></div><span class="v29-tl-badge">P${t.priority}</span></div>`).join(''):`<div class="v29-empty-tl"><div class="icon">◷</div><b>No area schedule</b><span>Add a start time to an area-linked task and it will appear here.</span></div>`}
        </div>
      </div>`;
    }catch(err){
      console.error('Areas renderer failed',err);
      root.innerHTML=`<div class="v29-shell"><div class="v29-head"><div><div class="v29-title">Areas</div><div class="v29-sub">Your life areas.</div></div><button class="btn primary" data-act="addArea">+ Area</button></div><div class="v29-card"><div class="v29-label">LIFE MAP</div><div style="margin-top:10px">Areas could not be rendered from the current data. Your saved data has not been deleted.</div></div></div>`;
    }
  };

})();

boot();

})();
</script>
<script>
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
<script>/* TS UI 2.0 boot marker */</script>
</body>
</html>
